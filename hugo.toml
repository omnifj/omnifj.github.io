baseURL = "https://omnifj.github.io/"
title = "omnifj"
locale = "zh-CN"
defaultContentLanguage = "zh"
enableRobotsTXT = true
enableGitInfo = true
paginate = 8

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  description = "记录技术、阅读与生活"
  author = "omnifj"
  keywords = ["技术博客", "omnifj", "编程", "软件工程"]
  since = 2026
  github = "https://github.com/omnifj"
  email = "omnivue666@gmail.com"
  heroWords = ["坚持", "耐心", "热爱", "好奇", "勇气", "专注"]

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/"
  weight = 10
[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 20
[[menu.main]]
  identifier = "works"
  name = "作品"
  url = "/works/"
  weight = 30
[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 40
[[menu.main]]
  identifier = "friends"
  name = "链接"
  url = "/friends/"
  weight = 50
[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 60
[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 70

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
