baseURL = "https://omnifj.github.io/"
locale = "zh-cn"
title = "omnifj's Blog"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  description = "记录技术、阅读与生活"
  author = "omnifj"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

[params.homeInfoParams]
  Title = "欢迎来到我的博客"
  Content = "这里记录技术、阅读与生活。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/omnifj"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30
