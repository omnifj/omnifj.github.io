{{ define "main" }}

    <p class="error-code">404</p>
    <p class="eyebrow"><span></span> PAGE NOT FOUND</p>

    <p>你要找的页面不存在，或者已经被移动。不如回到首页继续逛逛。</p>

  </div>
  <svg class="error-wind" viewBox="0 0 360 120" aria-hidden="true" shape-rendering="crispEdges">
    <path d="M8 72h56V64h48V48h40v8h40v8h48v16h48V64h40V48h32"/>
    <path d="M4 96h72V88h56v-8h40v8h48v8h48v-8h56"/>

  </svg>
</div>
{{ end }}
