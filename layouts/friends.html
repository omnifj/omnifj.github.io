{{ define "main" }}
<article class="post-single">
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        {{ with .Description }}<div class="post-description">{{ . }}</div>{{ end }}
    </header>
    <div class="post-content">
        {{ .Content }}
        <div class="friends-grid">
            {{ range site.Data.friends }}
            <a class="friend-card" href="{{ .url }}" target="_blank" rel="noopener"{{ with .themeColor }} style="--friend-color: {{ . }}"{{ end }}>
                {{ if .avatar }}
                <img class="friend-avatar" src="{{ .avatar }}" alt="{{ .name }}" loading="lazy">
                {{ else }}
                <span class="friend-avatar friend-avatar-fallback">{{ substr .name 0 1 }}</span>
                {{ end }}
                <span class="friend-info">
                    <strong class="friend-name">{{ .name }}</strong>
                    {{ with .description }}<span class="friend-desc">{{ . }}</span>{{ end }}
                </span>
            </a>
            {{ end }}
        </div>
    </div>
</article>
{{ end }}
