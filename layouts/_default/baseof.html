<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="progress-bar" id="progress-bar"></div>
  {{ partial "site-header.html" . }}
  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>
  <button class="back-to-top" id="back-to-top" aria-label="回到顶部">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false">
      <path d="M3 6 8 2l5 4" />
      <path d="M3 10 8 6l5 4" />
      <path d="M3 14 8 10l5 4" />
    </svg>
  </button>
  {{ partial "site-footer.html" . }}
  {{- $js := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
